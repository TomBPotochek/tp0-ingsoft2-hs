services:
    app:
        build:
            context: .
            target: runtime-app
        image: tp0
        ports:
            - "${HOST_IP:-0.0.0.0}:${PORT:-8080}:1234"
        environment:
            DATABASE_URL: postgresql://${DATABASE_USER:-app_user}:${DATABASE_PASSWORD:-app_pass}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-app_db}
            ENVIRONMENT: ${ENVIRONMENT:-development}
        depends_on:
            postgres:
                condition: service_healthy

    unit-tests:
        build:
            context: .
            target: tester
        image: tp0-tester
        command: ["stack", "test", "tp0:test:tp0-test"]
        environment:
            DATABASE_URL: postgresql://${DATABASE_USER:-app_user}:${DATABASE_PASSWORD:-app_pass}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-app_db}
        volumes:
            - stack_root_cache:/root/.stack
            - stack_work_cache:/app/user/.stack-work
        depends_on:
            postgres:
                condition: service_healthy
        profiles: ["test"]

    integration-tests:
        build:
            context: .
            target: tester
        image: tp0-tester
        command: ["stack", "test", "tp0:test:tp0-integration"]
        environment:
            INTEGRATION_DATABASE_URL: postgresql://integration_user:integration_pass@postgres-integration:5432/integration_db
        volumes:
            - stack_root_cache:/root/.stack
            - stack_work_cache:/app/user/.stack-work
        depends_on:
            postgres-integration:
                condition: service_healthy
        profiles: ["integration"]

    e2e-tests:
        build:
            context: .
            target: runtime-e2e
        image: tp0-e2e
        networks: [e2e]
        depends_on:
            app-e2e:
                condition: service_started
        environment:
            E2E_HOST: app-e2e
            E2E_PORT: "1234"
        profiles: ["e2e"]

    app-e2e:
        build:
            context: .
            target: runtime-app
        image: tp0
        networks: [e2e]
        environment:
            DATABASE_URL: postgresql://e2e_user:e2e_pass@postgres-e2e:5432/e2e_db
            ENVIRONMENT: development
        depends_on:
            postgres-e2e:
                condition: service_healthy
        profiles: ["e2e"]

    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: ${DATABASE_USER:-app_user}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-app_pass}
            POSTGRES_DB: ${DATABASE_NAME:-app_db}
        volumes:
            - postgres_app_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-app_user} -d ${DATABASE_NAME:-app_db}"]
            interval: 5s
            timeout: 3s
            retries: 20

    postgres-e2e:
        image: postgres:16
        networks: [e2e]
        environment:
            POSTGRES_USER: e2e_user
            POSTGRES_PASSWORD: e2e_pass
            POSTGRES_DB: e2e_db
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U e2e_user -d e2e_db"]
            interval: 5s
            timeout: 3s
            retries: 20
        profiles: ["e2e"]

    postgres-integration:
        image: postgres:16
        environment:
            POSTGRES_USER: integration_user
            POSTGRES_PASSWORD: integration_pass
            POSTGRES_DB: integration_db
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U integration_user -d integration_db"]
            interval: 5s
            timeout: 3s
            retries: 20
        profiles: ["integration"]

volumes:
    postgres_app_data:
    stack_root_cache:
    stack_work_cache:

networks:
    e2e:
