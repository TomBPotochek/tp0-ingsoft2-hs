name:                tp0
version:             0.1.0.0
github:              "TomBPotochek/tp0-ingsoft2-hs"
license:             BSD-3-Clause
author:              "Tom B Potochek"
maintainer:          "TomBPotochek@gmail.com"
copyright:           "2026 Tom B Potochek"

extra-source-files:
- README.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/TomBPotochek/tp0-ingsoft2-hs#readme>

dependencies:
- base >=4.7 && <5
- aeson
- bytestring
- openapi3
- http-client
- http-client-tls
- text
- time
- servant-client
- servant-openapi3
- servant-server
- wai
- warp
- polysemy
- persistent
- persistent-template
- persistent-postgresql
- monad-logger

language: GHC2024

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

default-extensions:
- TypeApplications
- NumericUnderscores 

flags:
  local-dev:
    description: Enable local development-only tooling (Polysemy plugin)
    manual: true
    default: false

library:
  exposed-modules:
  - Lib
  - API.DTO.Product
  - API.Routes
  - App.Effects.ProductRepository
  - Domain.Product
  - Infra.Persistence.Models
  - Infra.Persistence.Seed
  other-modules:
  - App.Handlers.Product
  - App.ProductCreation
  - Infra.Persistence.ProductRepository
  when:
  - condition: flag(local-dev)
    dependencies:
    - polysemy-plugin
    ghc-options:
    - -fplugin=Polysemy.Plugin
  source-dirs: src

executables:
  tp0:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - base
    - tp0

  tp0-e2e:
    main:                Main.hs
    source-dirs:         test-e2e
    other-modules:
    - E2E.Support
    - E2E.ProductsSpec
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - base
    - hspec
    - tp0

tests:
  tp0-test:
    main:                Main.hs
    source-dirs:         test
    other-modules:
    - API.DTO.ProductSpec
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - base
    - hspec
    - tp0

  tp0-integration:
    main:                Main.hs
    source-dirs:         test-integration
    other-modules:
    - Integration.Support
    - Integration.ProductsApiSpec
    - Integration.ProductsHttpSpec
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - base
    - bytestring
    - hspec
    - hspec-wai
    - http-types
    - monad-logger
    - persistent
    - persistent-postgresql
    - tp0
    - wai-extra
